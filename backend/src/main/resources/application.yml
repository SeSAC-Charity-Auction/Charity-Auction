spring:
  profiles:
    # 프로필을 따로 정하지 않으면 local로 실행돼요. (개발용 임시 로그인은 local에서만 켜져요)
    # 배포할 때는 SPRING_PROFILES_ACTIVE를 꼭 다른 값으로 지정하세요.
    default: local
  application:
    name: charity-auction
  config:
    # backend/.env의 DB 접속 정보와 JWT_SECRET을 읽어요. (.env는 커밋하지 않아요)
    import: optional:file:.env[.properties]
  jackson:
    time-zone: Asia/Seoul

  servlet:
    multipart:
      # 프로필 사진은 2MB까지예요. (검사는 ProfileImageService가 한 번 더 해요)
      max-file-size: 3MB
      max-request-size: 3MB

  datasource:
    # 서버·DB 시간은 모두 한국 시간(KST)이에요. 이름(Asia/Seoul)은 MySQL 시간대 표가 없으면 안 돼서 GMT+9로 지정해요.
    url: ${DB_URL:jdbc:mysql://localhost:3306/auctions?connectionTimeZone=GMT%2B9&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: Asia/Seoul

  flyway:
    enabled: true
    baseline-on-migrate: true

# 업로드한 파일을 저장할 폴더예요. 배포할 때는 UPLOAD_DIR로 영구 저장소를 지정하세요.
app:
  upload-dir: ${UPLOAD_DIR:uploads}

# JWT 로그인 설정.
security:
  jwt:

    secret: ${JWT_SECRET}
    expiration-seconds: 3600
  refresh-token:
    expiration-seconds: 1209600
    cookie-secure: false

# 경매 시작·마감을 시간에 맞춰 처리하는 스케줄러예요. 끄려면 SCHEDULER_AUCTION_ENABLED=false
scheduler:
  auction:
    enabled: ${SCHEDULER_AUCTION_ENABLED:true}

logging:
  level:
    org.springframework.security: TRACE
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

