spring:
  profiles:
    # 프로필을 따로 정하지 않으면 local로 실행돼요. (개발용 임시 로그인은 local에서만 켜져요)
    # 배포할 때는 SPRING_PROFILES_ACTIVE를 꼭 다른 값으로 지정하세요.
    default: local
  application:
    name: charity-auction
  jackson:
    time-zone: UTC

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/auctions}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true