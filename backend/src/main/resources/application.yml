spring:
  application:
    name: charity-auction
  jackson:
    time-zone: UTC

  datasource:
    url: jdbc:mysql://localhost:3306/auctions
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true